name: iOS Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    env:
      HAS_SIGNING: ${{ secrets.ASC_KEY_P8_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx cap sync ios

      # 서명 정보가 없으면: 시뮬레이터용 빌드로 컴파일만 검증
      - name: Simulator build (no signing)
        if: env.HAS_SIGNING != 'true'
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -20

      # 서명 정보가 있으면: Archive → App Store Connect(TestFlight) 업로드
      - name: Prepare App Store Connect API key
        if: env.HAS_SIGNING == 'true'
        run: |
          mkdir -p $RUNNER_TEMP/keys
          echo "${{ secrets.ASC_KEY_P8_BASE64 }}" | base64 -d > $RUNNER_TEMP/keys/AuthKey.p8

      - name: Archive & upload to TestFlight
        if: env.HAS_SIGNING == 'true'
        working-directory: ios/App
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $RUNNER_TEMP/keys/AuthKey.p8 -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER_ID"
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath $RUNNER_TEMP/App.xcarchive \
            DEVELOPMENT_TEAM=$TEAM_ID CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            $AUTH archive
          sed "s/__TEAM_ID__/$TEAM_ID/" ci/ExportOptions.plist > $RUNNER_TEMP/ExportOptions.plist
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export $AUTH
