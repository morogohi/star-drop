name: Android Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # ubuntu-latest 러너에는 Android SDK가 기본 설치되어 있음 ($ANDROID_HOME)
      - run: npm ci
      - run: npx cap sync android

      - name: Decode keystore (if secret exists)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > $RUNNER_TEMP/release.jks
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
          fi

      - name: Build APK + AAB
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon

      - name: Check signing (release tags)
        if: startsWith(github.ref, 'refs/tags/v') && env.ANDROID_KEYSTORE_PATH == ''
        run: |
          echo "::error::출시 태그인데 서명키 Secrets가 없습니다. DEPLOY.md 3-3 참고 (ANDROID_KEYSTORE_BASE64 등 4개)"
          exit 1

      - name: Rename outputs
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/stardrop-${{ github.ref_name }}-test.apk
          cp android/app/build/outputs/bundle/release/app-release.aab dist/stardrop-${{ github.ref_name }}-play.aab

      - name: GitHub Release (v* 태그)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            - `*-play.aab` → Google Play Console에 업로드 (서명됨)
            - `*-test.apk` → 안드로이드 폰에 바로 설치해 보는 테스트용

      - uses: actions/upload-artifact@v4
        with:
          name: stardrop-android
          path: dist/*

      # 선택: Play Console 내부 테스트 트랙 자동 업로드 (secrets.PLAY_SERVICE_ACCOUNT_JSON 설정 시)
      - name: Upload to Google Play (internal)
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_PLAY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.morogohi.stardrop
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: draft
